# XcodeGen alternative to Tools/generate_xcodeproj.py.
#
# The checked-in Lucid.xcodeproj is produced by Tools/generate_xcodeproj.py,
# which needs nothing but Python 3. This file is here so that anyone who
# already uses XcodeGen can regenerate an equivalent project instead:
#
#     brew install xcodegen && xcodegen generate
#
# Keep the two in sync when build settings change.

name: Lucid
options:
  bundleIdPrefix: com.lucid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Lucid:
    type: application
    platform: iOS
    sources:
      - path: Lucid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucid.Lucid
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Lucid uses the camera and torch to analyze light scattering in a water sample. Video is processed on this iPhone and is not saved unless you explicitly export diagnostics."

  LucidTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LucidTests
    dependencies:
      - target: Lucid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucid.LucidTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
